{% extends "base.html" %}
{% block title %}Sign in · Harbor WMS{% endblock %}
{% block guest %}
<div class="login-wrap">
  <div class="card login-card">
    <p class="eyebrow">Harbor WMS</p>
    <h2>Sign in to the floor</h2>
    <p class="muted">Jakarta distribution operations, inbound through outbound.</p>
    <form method="post" style="margin-top:20px">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn accent" type="submit">Enter warehouse</button>
    </form>
    <p class="help" style="margin-top:16px">Demo: <code>admin / admin123</code> or <code>operator / operator123</code></p>
  </div>
</div>
{% endblock %}
